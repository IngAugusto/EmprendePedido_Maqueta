<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmprendePedido – Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="logo-text">Emprende<span>Pedido</span></div>

    <div class="alert alert-error" id="errorMsg" role="alert" hidden>
      <span aria-hidden="true">⚠️</span>
      <span>No fue posible iniciar sesión. Verifica tus datos e inténtalo nuevamente.</span>
    </div>

    <form id="loginForm" action="pedidos.html" method="get" novalidate>
      <div class="form-group">
        <label for="usuario">Correo o usuario <span class="req">*</span></label>
        <input type="text" id="usuario" name="usuario" placeholder="ej. admin@emprendepedido.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña <span class="req">*</span></label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        <p class="hint">Mínimo 6 caracteres</p>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem">Ingresar</button>
    </form>
    <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      const user = document.getElementById('usuario').value.trim();
      const pass = document.getElementById('password').value;
      if (!user || !pass) {
        e.preventDefault();
        const msg = document.getElementById('errorMsg');
        msg.hidden = false;
        msg.querySelector('span:last-child').textContent = 'Este campo es obligatorio. Ingresa la información solicitada.';
      }
    });
  </script>
</body>
</html>
